<svg viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4FC3F7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#12161c"/>
  <text x="590" y="30" fill="#E0E0E0" font-size="20" text-anchor="middle" font-weight="bold">
    MIPS Single-Cycle Datapath
  </text>

  <!-- PC -->
  <rect x="30" y="260" width="70" height="60" rx="6" fill="#1e2733" stroke="#4FC3F7" stroke-width="2"/>
  <text x="65" y="295" fill="#E0E0E0" font-size="14" text-anchor="middle">PC</text>

  <!-- Instruction Memory -->
  <rect x="160" y="230" width="150" height="120" rx="6" fill="#1e2733" stroke="#4FC3F7" stroke-width="2"/>
  <text x="235" y="285" fill="#E0E0E0" font-size="13" text-anchor="middle">Memória de</text>
  <text x="235" y="303" fill="#E0E0E0" font-size="13" text-anchor="middle">Instrução</text>

  <!-- Control Unit -->
  <rect x="360" y="60" width="130" height="80" rx="6" fill="#25314a" stroke="#FFB74D" stroke-width="2"/>
  <text x="425" y="95" fill="#FFB74D" font-size="13" text-anchor="middle">Unidade de</text>
  <text x="425" y="113" fill="#FFB74D" font-size="13" text-anchor="middle">Controle</text>

  <!-- Register File -->
  <rect x="400" y="220" width="140" height="140" rx="6" fill="#1e2733" stroke="#4FC3F7" stroke-width="2"/>
  <text x="470" y="280" fill="#E0E0E0" font-size="13" text-anchor="middle">Banco de</text>
  <text x="470" y="298" fill="#E0E0E0" font-size="13" text-anchor="middle">Registradores</text>

  <!-- Sign Extend -->
  <rect x="400" y="420" width="140" height="60" rx="6" fill="#1e2733" stroke="#4FC3F7" stroke-width="2"/>
  <text x="470" y="455" fill="#E0E0E0" font-size="13" text-anchor="middle">Sign Extend</text>

  <!-- ALUSrc mux -->
  <polygon points="600,255 630,270 600,285" fill="#25314a" stroke="#FFB74D" stroke-width="2"/>
  <text x="592" y="273" fill="#FFB74D" font-size="10" text-anchor="end">ALUSrc</text>

  <!-- ALU -->
  <polygon points="660,220 700,240 700,300 660,320 640,280 640,260" fill="#1e2733" stroke="#4FC3F7" stroke-width="2"/>
  <text x="670" y="275" fill="#E0E0E0" font-size="14" text-anchor="middle">ALU</text>

  <!-- ALU Control -->
  <rect x="600" y="340" width="100" height="50" rx="6" fill="#25314a" stroke="#FFB74D" stroke-width="2"/>
  <text x="650" y="370" fill="#FFB74D" font-size="12" text-anchor="middle">ALU Control</text>

  <!-- Data Memory -->
  <rect x="760" y="220" width="140" height="140" rx="6" fill="#1e2733" stroke="#4FC3F7" stroke-width="2"/>
  <text x="830" y="280" fill="#E0E0E0" font-size="13" text-anchor="middle">Memória de</text>
  <text x="830" y="298" fill="#E0E0E0" font-size="13" text-anchor="middle">Dados</text>

  <!-- MemToReg mux -->
  <polygon points="940,255 970,270 940,285" fill="#25314a" stroke="#FFB74D" stroke-width="2"/>
  <text x="932" y="248" fill="#FFB74D" font-size="10" text-anchor="end">MemToReg</text>

  <!-- Branch adder -->
  <rect x="600" y="110" width="90" height="50" rx="6" fill="#1e2733" stroke="#4FC3F7" stroke-width="2"/>
  <text x="645" y="140" fill="#E0E0E0" font-size="12" text-anchor="middle">Somador</text>

  <!-- PC+4 adder -->
  <rect x="120" y="150" width="90" height="45" rx="6" fill="#1e2733" stroke="#4FC3F7" stroke-width="2"/>
  <text x="165" y="177" fill="#E0E0E0" font-size="12" text-anchor="middle">PC + 4</text>

  <!-- Branch mux -->
  <polygon points="1000,150 1030,165 1000,180" fill="#25314a" stroke="#FFB74D" stroke-width="2"/>
  <text x="1015" y="140" fill="#FFB74D" font-size="10" text-anchor="middle">Branch/Jump</text>

  <!-- Connections -->
  <line x1="100" y1="290" x2="160" y2="290" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="65" y1="260" x2="65" y2="172" stroke="#4FC3F7" stroke-width="2"/>
  <line x1="65" y1="172" x2="120" y2="172" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="290" x2="400" y2="290" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="260" x2="425" y2="260" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="425" y1="140" x2="425" y2="260" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="310" y1="480" x2="400" y2="450" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="260" x2="600" y2="262" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="450" x2="615" y2="285" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="270" x2="640" y2="270" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="270" x2="760" y2="270" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="230" x2="900" y2="230" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="900" y1="230" x2="900" y2="270" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="900" y1="270" x2="940" y2="270" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="900" y1="290" x2="940" y2="280" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="365" x2="600" y2="365" stroke="#FFB74D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="140" x2="360" y2="100" stroke="#FFB74D" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Legend -->
  <rect x="30" y="500" width="18" height="12" fill="#1e2733" stroke="#4FC3F7"/>
  <text x="55" y="510" fill="#E0E0E0" font-size="12">Bloco funcional (dado)</text>
  <rect x="30" y="525" width="18" height="12" fill="#25314a" stroke="#FFB74D"/>
  <text x="55" y="535" fill="#E0E0E0" font-size="12">Bloco de controle / sinal</text>
  <line x1="30" y1="555" x2="48" y2="555" stroke="#4FC3F7" stroke-width="2"/>
  <text x="55" y="559" fill="#E0E0E0" font-size="12">Fluxo de dados</text>
  <line x1="30" y1="575" x2="48" y2="575" stroke="#FFB74D" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="55" y="579" fill="#E0E0E0" font-size="12">Sinal de controle</text>

  <text x="590" y="620" fill="#7d8894" font-size="12" text-anchor="middle">
    Implementação equivalente em código: src/datapath.py (função step)
  </text>
</svg>
